[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banco-pronostico-solar"
version = "0.6.0"
description = "Banco de pruebas y motor de pronóstico operativo solar"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "pvlib>=0.11",
    "scikit-learn>=1.4", "matplotlib>=3.8", "pyarrow>=16",
]

[project.optional-dependencies]
# Segunda implementación independiente de los detectores. Una sola
# implementación de acuerdo consigo misma no es evidencia.
cruce = ["pvanalytics>=0.2", "rdtools>=3.0"]
dev = ["pytest>=8.0", "nbformat>=5.9"]

[tool.setuptools]
packages = ["banco"]

# La configuración de pytest vive en pytest.ini, no aquí: tenerla en los dos
# sitios hace que pytest avise «ignoring pytest config in pyproject.toml».
