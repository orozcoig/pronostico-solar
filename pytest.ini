[pytest]
# pythonpath = . hace que `banco` se encuentre sin instalar el paquete.
# Sin esta línea, `pytest tests/` falla con «No module named 'banco'» mientras
# `python -m pytest tests/` funciona: la segunda forma agrega la carpeta actual
# a la ruta de búsqueda y la primera no. El workflow usaba la forma que falla.
pythonpath = .
markers =
    lento: pruebas que necesitan series largas (24 meses); no corren en el CI rápido
testpaths = tests
